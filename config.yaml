# Data Desk Bot — intake & filing configuration.
# Categories, regions and sources are data, not code: add new working areas here.

paths:
  # Intake folders (relative to the Documents drive root). Whole subtrees are watched.
  intake:
    - "Data Drop"
    - "Apps/Microsoft Teams Mailhook/Data Drop"
  mailhook: "Apps/Microsoft Teams Mailhook/Data Drop"
  data_root: "Data"
  catalog_folder: "Catalog and Water Accounting"
  needs_review: "_Inbox/needs-review"
  duplicates: "_Inbox/duplicates"
  # Where filed .eml messages go. Set to null to leave them in the mailhook folder.
  emails: "_Inbox/emails"

thresholds:
  min_confidence: 0.5
  upload_settle_minutes: 2       # files modified more recently are re-checked next cycle
  email_wait_cycles: 2           # cycles an attachment waits for its .eml before going without
  max_attempts: 3                # failed processing attempts before giving up on a file
  summary_card_threshold: 5      # more files than this in one run -> one summary card
  global_lon_span: 90            # bbox wider than this (degrees lon) -> region "Global"

schedule:
  poll_interval_minutes: 10

filing:
  move_mode: move                # move | copy  (copy leaves the original in the intake folder)
  latest_copy: false             # also keep a copy of the newest version in <Dataset>/latest/
  metadata_columns: true         # set library columns (Category, Region, ...) when they exist

state:
  backend: sharepoint            # local | sharepoint (GitHub Actions runs keep no disk between runs)
  local_path: "state/state.json"
  sharepoint_path: "_system/state.json"

# Dept. of Meteorology 15-day forecast bulletins (PDF named <YYYYMMDD>_00Z.pdf or <YYYYMMDD>12Z.pdf) go to AWARE Sri
# Lanka's forecast maps, then filed under `folder`/<year>/. AWARE checks the PDF against the bulletin layout;
# anything else is filed as usual. Emailed bulletins must come from allowed_senders (address or @domain).
# Needs MET_UPLOAD_TOKEN in .env (the same value as in the AWARE Vercel project).
met_bulletin:
  enabled: true
  upload_url: "https://aware-srilanka.vercel.app/api/met/upload"
  site_url: "https://aware-srilanka.vercel.app"
  folder: "Data/Climate/Sri Lanka/DoM_15day_forecast"
  allowed_senders: ["@meteo.gov.lk", "@cgiar.org"]

# Files matching these (case-insensitive regex on the original filename) are left alone.
ignore_patterns:
  - '^~\$'
  - '\.tmp$'
  - '^\.~lock\.'
  - '^image\d{3}\.(png|jpe?g|gif)$'   # inline signature images saved from emails

categories:
  Climate:       [precip, precipitation, pr, tp, rain, rainfall, chirps, era5, tas, tmax, tmin, temperature, et, evapotranspiration, pet, aet]
  Hydrology:     [flood, flooded, flooding, inundation, discharge, streamflow, runoff, flow, groundwater, gw, reservoir, lake, water_level, storage, tws, grace]
  LandUse:       [landcover, land_cover, lulc, irrigation, cropland, ndvi, evi, lai]
  Boundaries:    [basin, catchment, watershed, admin, boundary, gadm, hydrobasins]
  Socioeconomic: [survey, household, population, census, income, socio]
fallback: _Inbox/needs-review

# Known data sources. Key = name used in folders/filenames; values = aliases to match.
sources:
  CHIRPS: [chirps]
  CHIRTS: [chirts]
  ERA5-Land: [era5-land, era5 land, era5land]
  ERA5: [era5]
  GRACE: [grace, grace-fo]
  MODIS: [modis, mod13, mod16, mod17, myd13]
  Landsat: [landsat]
  Sentinel: [sentinel, sentinel-1, sentinel-2]
  TerraClimate: [terraclimate]
  GLDAS: [gldas]
  FLDAS: [fldas]
  WaPOR: [wapor]
  SMAP: [smap]
  IMERG: [imerg, gpm]
  TRMM: [trmm]
  PERSIANN: [persiann]
  MSWEP: [mswep]
  GPCC: [gpcc]
  CRU: [cru]
  WorldClim: [worldclim]
  CMIP6: [cmip6]
  CORDEX: [cordex]
  ESA-CCI: [esa cci, esa-cci, cci]
  ESA: [esa, worldcover]
  GloFAS: [glofas]
  MERIT: [merit]
  SRTM: [srtm]
  HydroSHEDS: [hydrosheds]
  HydroBASINS: [hydrobasins]
  GADM: [gadm]
  WorldPop: [worldpop]
  DHS: [dhs]
  FAO: [fao, faostat]
  JRC: [jrc]

# Regions: matched against filename, file attributes and email subject/body.
# Upper-case aliases of 3 letters or fewer (ISO3 codes) are not matched in email bodies.
# bbox = [west, south, east, north] in degrees (approximate). Used when no name matches:
# the smallest region containing the data's centre and covering most of its bbox wins.
